<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
        <link type="text/css" rel="stylesheet" href="../dist/temporal-datetimerange-picker.css">
        <title>temporal-datetimerange-picker simple example.</title>
    </head>
    <body>
        <div><input type="text" id="datetimerange-input1" size="40" style="text-align:center"></div>
        <div><input type="button" value="change range" onclick='rangeChange();'></div>
        <!-- Temporal ships natively in modern browsers (Firefox 139+, Chrome 144+). This polyfill
             is only needed as a fallback for browsers without native support yet (e.g. Safari). -->
        <script src="https://cdn.jsdelivr.net/npm/@js-temporal/polyfill/dist/index.umd.js" type="text/javascript"></script>
        <script src="../dist/temporal-datetimerange-picker.js"></script>
        <script>
            var Temporal = window.Temporal || window.temporal.Temporal;

            function startOfDay(t) { return t.with({ hour: 0, minute: 0, second: 0, millisecond: 0, microsecond: 0, nanosecond: 0 }); }
            function endOfDay(t) { return t.with({ hour: 23, minute: 59, second: 59, millisecond: 999, microsecond: 999, nanosecond: 999 }); }

            var drp;
            var rangeChange = function(){
                var now = Temporal.Now.plainDateTimeISO();
                drp.updateRanges({
                    'Last 3 Days': [startOfDay(now.subtract({ days: 2 })), endOfDay(now)],
                    'This Year': [startOfDay(now.with({ month: 1, day: 1 })), endOfDay(now.with({ month: 12, day: 31 }))],
                });
            };
            window.addEventListener("load", function (event) {
                var now = Temporal.Now.plainDateTimeISO();
                drp = new DateRangePicker('datetimerange-input1',
                    {
                        //startDate: '2000-01-01',
                        //endDate: '2000-01-03',
                        //minDate: '2021-07-15 15:00',
                        //maxDate: '2021-08-16 15:00',
                        //maxSpan: { "days": 9 },
                        //showDropdowns: true,
                        //minYear: 2020,
                        //maxYear: 2022,
                        //showWeekNumbers: true,
                        //showISOWeekNumbers: true,
                        timePicker: true,
                        //timePickerIncrement: 10,
                        //timePicker24Hour: true,
                        //timePickerSeconds: true,
                        //showCustomRangeLabel: false,
                        alwaysShowCalendars: true,
                        //opens: 'center',
                        //drops: 'up',
                        singleDatePicker: true,
                        //autoApply: true,
                        //linkedCalendars: false,
                        //isInvalidDate: function(m){
                        //    return m.weekday() == 3;
                        //},
                        //isCustomDate: function(m){
                        //    return "weekday-" + m.weekday();
                        //},
                        //autoUpdateInput: false,
                        ranges: {
                            'Today': [startOfDay(now), endOfDay(now)],
                            'Yesterday': [startOfDay(now.subtract({ days: 1 })), endOfDay(now.subtract({ days: 1 }))],
                            'Last 7 Days': [startOfDay(now.subtract({ days: 6 })), endOfDay(now)],
                            'This Month': [startOfDay(now.with({ day: 1 })), endOfDay(now.with({ day: now.daysInMonth }))],
                        },
                        locale: {
                            format: "YYYY-MM-DD HH:mm:ss",
                        }
                    },
                    function (start, end) {
                        alert(start.format() + " - " + end.format());
                    })
                //drp.setStartDate('2014/03/01');
                //drp.setEndDate('2014/03/03');
                window.addEventListener('apply.daterangepicker', function (ev) {
                    console.log(ev.detail.startDate.format('YYYY-MM-DD'));
                    console.log(ev.detail.endDate.format('YYYY-MM-DD'));
                });
            });
        </script>
    </body>
</html>
